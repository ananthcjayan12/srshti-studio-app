name: Portfolio build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify all carousel images resolve to WebP files
        run: node scripts/check_portfolio_assets.mjs
      - name: Build responsive React website
        run: npm run build
