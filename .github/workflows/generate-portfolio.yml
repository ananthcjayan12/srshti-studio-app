name: Generate optimized portfolio concepts
on:
  workflow_dispatch:
  push:
    branches:
      - feature/real-carousel-portfolio-webp
    paths:
      - .github/workflows/generate-portfolio.yml
      - scripts/create_portfolio_art.py
permissions:
  contents: write
jobs:
  render-webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate original Milano/Orbi WebP artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/create_portfolio_art.py
      - name: Commit static optimized WebP media
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/images/portfolio/milano-story-*.webp public/images/portfolio/orbi-story-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: add ten optimized Milano/Orbi carousel slides"
            git push
          fi
